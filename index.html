<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8eede"><title>Mein Traumpferd 4.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#44372f;background:#f8f0e5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}header{padding:16px;display:flex;align-items:center;justify-content:space-between;background:#fff8ef;position:sticky;top:0;z-index:5}h1{font-size:clamp(21px,5vw,31px);margin:0;color:#744b62}.pill{background:white;border-radius:25px;padding:9px 13px;font-weight:800}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;position:sticky;top:65px;background:#f8f0e5;z-index:4}nav button{border:0;border-radius:16px;background:#f6dfae;padding:12px 3px;font-weight:750;font-size:14px;color:#493c34}nav button.active{background:#985b73;color:white}main{max-width:780px;margin:auto;padding:10px 12px 60px}.card{background:#fffdf9;border:2px solid #ecdcc8;border-radius:24px;padding:18px;margin-bottom:15px;box-shadow:0 4px 12px #8b684010}h2{margin:0 0 14px;color:#744b62}h3{margin:12px 0}.muted{color:#7b7068}.btn{border:0;border-radius:15px;background:#965a72;color:white;font-weight:800;padding:13px 17px;margin:4px}.btn.alt{background:#eacb91;color:#493729}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{border:2px solid #f0d9b4;background:#fff3df;border-radius:18px;padding:18px 6px;font-size:26px;font-weight:850;color:#47362c;min-height:75px}.option:active{background:#e6bb83}.scene{width:100%;display:block;border-radius:20px;background:#d7eaf0;overflow:hidden;max-height:360px}.shopitem{border:1px solid #e9d4b7;border-radius:17px;padding:12px;background:#fff7e9}.shopitem strong{display:block}.shopitem button{margin-top:9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.badge{border-radius:12px;background:#f8e6c5;padding:8px 12px;display:inline-block;margin:4px}.question{font-size:clamp(35px,9vw,55px);text-align:center;font-weight:900;margin:17px 0;color:#62415c}.feedback{min-height:27px;text-align:center;font-weight:800;color:#7b4a64}.track{height:22px;border-radius:20px;background:#f1e3cc;overflow:hidden;margin:10px 0}.fill{height:100%;background:#a7c989;transition:width .45s}.small{font-size:13px}input,select{padding:12px;border-radius:12px;border:1px solid #cdbcae;max-width:100%}footer{text-align:center;color:#86766b;padding:18px}.hide{display:none!important}</style></head><body><header><h1>🐴 Mein Traumpferd</h1><span class="pill">🪙 <span id="coins">0</span></span></header><nav id="nav"></nav><main id="app"></main><footer>🌷 Ohne Werbung · Spielstände nur auf diesem Gerät</footer><script>
'use strict';const KEY='traumpferd4_profiles',OLD='traumpferd_profiles';let profiles=[],current='',tab='stall',session=null,animation=null;const items=[['coat','Fellfarbe','Fuchs',0],['coat','Fellfarbe','Rappe',35],['coat','Fellfarbe','Schimmel',45],['coat','Fellfarbe','Falbe',50],['mane','Mähne','Dunkel',0],['mane','Mähne','Blond',25],['mane','Mähne','Weiß',25],['mane','Mähne','Rotbraun',25],['halter','Halfter','Rosa',25],['halter','Halfter','Türkis',30],['halter','Halfter','Lila',35],['saddle','Sattel','Braun',65],['saddle','Sattel','Schwarz',75],['pad','Schabracke','Pink',30],['pad','Schabracke','Blau',30],['pad','Schabracke','Grün',30]];const colors={Fuchs:'#b97945',Rappe:'#3d3738',Schimmel:'#e4e3d9',Falbe:'#c9ab72',Dunkel:'#372b2c',Blond:'#e8ca75',Weiß:'#f6f1df',Rotbraun:'#8c4b34',Rosa:'#ec8da8',Türkis:'#54bac0',Lila:'#a58ad6',Braun:'#704633',Schwarz:'#2f3339',Pink:'#e58cab',Blau:'#729bcf',Grün:'#80a975'};function make(name){return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,coins:40,owned:['coat:Fuchs','mane:Dunkel'],equip:{coat:'Fuchs',mane:'Dunkel'},stats:{},awards:[],wins:0}}function save(){try{localStorage.setItem(KEY,JSON.stringify({profiles,current}))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.profiles)){profiles=s.profiles;current=s.current}}catch(e){}if(!profiles.length){profiles=[make('Sternchen')];current=profiles[0].id;save()}if(!profiles.some(p=>p.id===current))current=profiles[0].id}function p(){return profiles.find(x=>x.id===current)||profiles[0]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){let names=[['stall','🏡 Stall'],['shop','🛍️ Laden'],['train','📚 Training'],['course','🌳 Parcours'],['race','🏆 Rennen'],['horses','🐴 Pferde']];document.getElementById('nav').innerHTML=names.map(([id,n])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('')}function go(t){tab=t;session=null;stop();render()}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});function stop(){if(animation){clearInterval(animation);animation=null}}function horseSVG(h,scale=1){let c=colors[h.equip.coat||'Fuchs'],m=colors[h.equip.mane||'Dunkel'];let hal=h.equip.halter?`<path d="M247 89 L282 107 L271 122 L249 112 Z" fill="none" stroke="${colors[h.equip.halter]}" stroke-width="6"/><path d="M264 118 L263 140" stroke="${colors[h.equip.halter]}" stroke-width="4"/>`:'';let pad=h.equip.pad?`<path d="M103 112 Q147 99 193 114 L191 153 L109 154Z" fill="${colors[h.equip.pad]}" stroke="#55463f" stroke-width="2"/>`:'';let saddle=h.equip.saddle?`<path d="M110 109 Q146 92 181 109 L177 129 L118 132Z" fill="${colors[h.equip.saddle]}" stroke="#352a25" stroke-width="3"/><path d="M162 125 L166 172" stroke="#4b3930" stroke-width="3"/>`:'';return `<svg viewBox="0 0 330 240" width="100%" aria-label="Pferd ${esc(h.name)}"><ellipse cx="163" cy="216" rx="130" ry="10" fill="#777" opacity=".13"/><path d="M75 116 Q35 92 32 147 Q27 175 40 183 Q47 149 62 145" fill="${m}"/><path d="M98 139 L89 207 L104 207 L128 149 M171 145 L169 210 L184 210 L192 147 M200 141 L221 207 L237 207 L221 126 M124 146 L123 208 L138 208 L150 148" fill="${c}" stroke="#684b3a" stroke-width="3" stroke-linejoin="round"/><path d="M63 117 Q65 91 105 88 Q161 78 201 91 Q221 80 231 54 L245 36 L263 46 L269 70 Q302 76 305 99 Q308 114 287 120 Q270 127 253 114 L234 101 Q222 146 193 151 Q106 165 78 143 Q67 136 63 117Z" fill="${c}" stroke="#684b3a" stroke-width="3"/><path d="M217 91 Q228 68 231 51 L244 37 L255 42 Q249 65 240 78Z" fill="${m}"/><path d="M242 42 L242 16 L257 34Z M265 45 L277 23 L282 61Z" fill="${c}" stroke="#684b3a" stroke-width="3"/><circle cx="275" cy="82" r="4" fill="#2c2423"/><circle cx="298" cy="105" r="3" fill="#6b4c3d"/>${pad}${saddle}${hal}</svg>`}function stage(h){return `<div style="background:linear-gradient(#c7e9ed 0 65%,#cce2b0 65% 100%);border-radius:18px;padding:5px">${horseSVG(h)}</div>`}function render(){nav();document.getElementById('coins').textContent=p().coins;let a=document.getElementById('app');if(tab==='stall')a.innerHTML=stall();if(tab==='shop')a.innerHTML=shop();if(tab==='train')a.innerHTML=train();if(tab==='course')a.innerHTML=course();if(tab==='race')a.innerHTML=race();if(tab==='horses')a.innerHTML=horses();if(session&&(tab==='race'||tab==='course'||tab==='train'))showQuestion();if(tab==='race'&&session)drawRace();if(tab==='course'&&session)drawCourse()}function stall(){return `<section class="card"><h2>🌸 ${esc(p().name)} auf dem Reiterhof</h2>${stage(p())}<p class="muted">Dein Pferd trägt die Ausrüstung, die du im Laden angelegt hast.</p><div class="row"><button class="btn alt" onclick="care('🥕 Eine leckere Karotte!')">🥕 Füttern</button><button class="btn alt" onclick="care('🪮 Schön gestriegelt!')">🪮 Striegeln</button><button class="btn alt" onclick="care('🐾 Die Hufe sind sauber!')">🐾 Hufe pflegen</button><button class="btn alt" onclick="care('💕 Dein Pferd freut sich!')">💕 Streicheln</button></div><p id="caremsg" class="feedback"></p></section><section class="card"><h2>✨ Deine Erfolge</h2><span class="badge">🏆 ${p().wins||0} Rennsiege</span><span class="badge">⭐ ${Object.values(p().stats||{}).filter(s=>s.correct>=5).length} geübte Aufgaben</span><p class="muted">Verdiene Münzen im Training, beim Parcours und im Rennen!</p></section>`}function care(t){document.getElementById('caremsg').textContent=t}function shop(){return `<section class="card"><h2>🛍️ Pferdeladen & Kleiderschrank</h2><p>Gekaufte Dinge gehören dir dauerhaft. Tippe auf <b>Anlegen</b>, um sie am Pferd zu sehen.</p>${stage(p())}<div class="grid">${items.map(([kind,label,name,cost])=>{let own=p().owned.includes(kind+':'+name),on=p().equip[kind]===name;return `<div class="shopitem"><strong>${label}: ${name}</strong><span class="small">${own?'✓ Gekauft':'🪙 '+cost}</span><br><button class="btn ${own?'alt':''}" ${on?'disabled':''} onclick="buy('${kind}','${name}',${cost})">${on?'✓ Angelegt':own?'Anlegen':'Kaufen'}</button>${on&&['halter','saddle','pad'].includes(kind)?`<button class="btn alt" onclick="removeEquip('${kind}')">Ablegen</button>`:''}</div>`}).join('')}</div></section>`}function buy(k,n,c){let h=p(),id=k+':'+n;if(!h.owned.includes(id)){if(h.coins<c){alert('Noch nicht genug Münzen! Verdiene welche beim Reiten oder Training.');return}h.coins-=c;h.owned.push(id)}h.equip[k]=n;save();render()}function removeEquip(k){delete p().equip[k];save();render()}function train(){return `<section class="card"><h2>📚 Reitakademie</h2><p class="muted">Trainiere in deinem Tempo und verdiene Münzen für dein Pferd.</p><div class="row"><label>Reihe <select id="row"><option value="all">Alle Reihen</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}">${i+1}er-Reihe</option>`).join('')}</select></label><label>Aufgaben <select id="mode"><option value="mix">Mal und geteilt</option><option value="mul">Nur mal</option><option value="div">Nur geteilt</option><option value="weak">Schwierige Aufgaben</option></select></label></div><button class="btn" onclick="start('train')">✨ Training starten</button></section><section id="play" class="card ${session?'':'hide'}"></section><section class="card"><h2>🌟 Mein Trainingspass</h2><div class="grid">${Array.from({length:10},(_,i)=>{let n=i+1,all=Object.entries(p().stats||{}).filter(([k,v])=>k.startsWith(n+'x')||k.startsWith(n+':'));let good=all.filter(([k,v])=>v.correct>=2&&v.correct>v.wrong).length;return `<div class="badge">${n}er-Reihe · ${good>=15?'⭐⭐⭐':good>=8?'⭐⭐':good>=3?'⭐':'🌱'}</div>`}).join('')}</div></section>`}function course(){return `<section class="card"><h2>🌳 Der Abenteuer-Parcours</h2><p>Für jede richtige Aufgabe reitet dein Pferd zur nächsten Station. Schaffst du alle acht Hindernisse?</p><svg id="courseSvg" class="scene" viewBox="0 0 340 270" aria-label="Parcours aus der Draufsicht"></svg><button class="btn" onclick="start('course')">🏇 ${session?'Neu starten':'Parcours starten'}</button></section><section id="play" class="card ${session?'':'hide'}"></section>`}function race(){return `<section class="card"><h2>🏆 Das große Pferderennen</h2><p>Vier Pferde starten links und laufen nach rechts. Richtige Antworten bringen dein Pferd nach vorne!</p><svg id="raceSvg" class="scene" viewBox="0 0 340 245" aria-label="Rennstrecke mit vier Pferden"></svg><button class="btn" onclick="start('race')">🏁 ${session?'Neues Rennen':'Rennen starten'}</button></section><section id="play" class="card ${session?'':'hide'}"></section>`}function horses(){return `<section class="card"><h2>🐴 Meine Pferde</h2><p>Jedes Pferd hat eigene Münzen, Ausrüstung und Lernfortschritte.</p>${profiles.map(h=>`<div class="shopitem" style="margin:8px 0"><strong>🐴 ${esc(h.name)} ${h.id===current?'✓ Aktiv':''}</strong><span>🪙 ${h.coins}</span><br><button class="btn alt" onclick="switchHorse('${h.id}')">Spielen</button><button class="btn alt" onclick="resetHorse('${h.id}')">Neu starten</button></div>`).join('')}<h3>Neues Pferd</h3><input id="horseName" maxlength="24" placeholder="Name des Pferdes"><button class="btn" onclick="addHorse()">🐴 Anlegen</button></section>`}function switchHorse(id){current=id;save();go('stall')}function addHorse(){let n=document.getElementById('horseName').value.trim();if(!n)return alert('Bitte gib deinem Pferd einen Namen.');if(profiles.some(h=>h.name.toLowerCase()===n.toLowerCase()))return alert('Diesen Pferdenamen gibt es schon.');let h=make(n);profiles.push(h);current=h.id;save();go('stall')}function resetHorse(id){let h=profiles.find(x=>x.id===id);if(!confirm(`Spielstand von ${h.name} wirklich löschen und neu beginnen?`))return;let fresh=make(h.name);fresh.id=h.id;profiles=profiles.map(x=>x.id===id?fresh:x);save();go('horses')}
function randomTask(){let row=session.row,mode=session.mode;let a=row==='all'?1+Math.floor(Math.random()*10):Number(row),b=1+Math.floor(Math.random()*10);if(mode==='weak'){let entries=Object.entries(p().stats||{}).filter(([k,v])=>v.wrong>0||v.correct<2);if(entries.length){let key=entries[Math.floor(Math.random()*entries.length)][0],match=key.match(/^(\d+)(x|:)(\d+)$/);if(match){a=+match[1];b=+match[3];mode=match[2]==='x'?'mul':'div'}}else mode='mix'}let div=mode==='div'||(mode==='mix'&&Math.random()<.5),answer=div?b:a*b,question=div?`${a*b} ÷ ${a}`:`${a} × ${b}`,key=`${a}${div?':':'x'}${b}`;let opts=new Set([answer]);while(opts.size<4){let v=Math.max(1,answer+(Math.floor(Math.random()*11)-5));if(v<=100)opts.add(v)}return {answer,question,key,opts:[...opts].sort(()=>Math.random()-.5)}}function start(kind){stop();let row='all',mode='mix';if(kind==='train'){row=document.getElementById('row').value;mode=document.getElementById('mode').value}session={kind,row,mode,count:0,correct:0,streak:0,task:null,locked:false,positions:[0,0,0,0],started:Date.now()};next();render()}function next(){if(!session)return;session.task=randomTask();session.asked=Date.now();session.locked=false}function showQuestion(){let el=document.getElementById('play');if(!el||!session)return;el.classList.remove('hide');el.innerHTML=`<div class="row"><span class="badge">${session.kind==='train'?'📚 Training':session.kind==='course'?'🌳 Parcours':'🏆 Rennen'}</span><span class="badge">${session.count+1} / ${session.kind==='race'?12:session.kind==='course'?8:10}</span><span class="badge">✓ ${session.correct} richtig</span></div><div class="question">${session.task.question} = ?</div><div class="grid">${session.task.opts.map(x=>`<button class="option" onclick="answer(${x})">${x}</button>`).join('')}</div><p class="feedback" id="feedback">Du schaffst das! 💗</p>`}function answer(n){if(!session||session.locked)return;session.locked=true;let s=session,t=s.task,good=n===t.answer,elapsed=(Date.now()-s.asked)/1000;let st=p().stats[t.key]||{correct:0,wrong:0};st[good?'correct':'wrong']++;p().stats[t.key]=st;s.count++;if(good){s.correct++;s.streak++;p().coins+=2;if(s.kind==='race')s.positions[0]+=Math.max(6,17-Math.min(10,elapsed))+Math.min(7,s.streak*2);if(s.kind==='course')drawCourse()}else{s.streak=0}if(s.kind==='race'){for(let i=1;i<4;i++)s.positions[i]+=8+Math.random()*7;drawRace()}save();document.getElementById('coins').textContent=p().coins;document.getElementById('feedback').textContent=good?`✨ Super! +2 Münzen${elapsed<3?' · Blitzschnell! ⚡':''}`:`Fast! Richtig ist ${t.answer}. Wir üben das wieder.`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);setTimeout(()=>{if(session!==s)return;let limit=s.kind==='race'?12:s.kind==='course'?8:10;if(s.count>=limit){finish();return}next();showQuestion()},950)}function finish(){let s=session;if(!s)return;let bonus=s.correct>=Math.ceil((s.kind==='course'?8:s.kind==='race'?12:10)*.8)?15:5;if(s.kind==='race'){let rank=1+s.positions.slice(1).filter(x=>x>s.positions[0]).length;bonus+=rank===1?40:rank===2?20:rank===3?10:5;if(rank===1)p().wins=(p().wins||0)+1}p().coins+=bonus;save();document.getElementById('coins').textContent=p().coins;let el=document.getElementById('play');el.innerHTML=`<h2>🎉 Geschafft!</h2><p>Du hast <b>${s.correct} von ${s.count}</b> Aufgaben richtig gelöst!</p>${s.kind==='race'?`<p>🏆 Platz ${1+s.positions.slice(1).filter(x=>x>s.positions[0]).length} im Rennen!</p>`:''}<p>🪙 ${bonus} Bonusmünzen für dich!</p><button class="btn" onclick="go('${s.kind}')">Weiter</button>`;session=null}function drawCourse(){let svg=document.getElementById('courseSvg');if(!svg)return;let points=[[40,225],[100,225],[160,195],[235,195],[285,150],[240,105],[165,90],[100,65],[45,45]],i=Math.min(session?session.correct:0,8),[x,y]=points[i];svg.innerHTML=`<rect width="340" height="270" fill="#b9d8a2"/><path d="M40 225 L100 225 L160 195 L235 195 L285 150 L240 105 L165 90 L100 65 L45 45" fill="none" stroke="#d5b78d" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 225 L100 225 L160 195 L235 195 L285 150 L240 105 L165 90 L100 65 L45 45" fill="none" stroke="#f6e6c8" stroke-width="3" stroke-dasharray="5 9"/>${points.slice(1).map(([px,py],j)=>`<g transform="translate(${px} ${py})"><rect x="-19" y="-4" width="38" height="8" rx="2" fill="${j%2?'#b56a6a':'#fff9e7'}" stroke="#835c45"/></g>`).join('')}<text x="11" y="22" font-size="14">🌳 🌸 🌳</text><text x="245" y="250" font-size="15">🌼 🌲</text><g transform="translate(${x} ${y})"><circle r="18" fill="#fff5e2" opacity=".8"/><text text-anchor="middle" dominant-baseline="central" font-size="26">🏇</text></g>`}function drawRace(){let svg=document.getElementById('raceSvg');if(!svg)return;let pos=session?session.positions:[0,0,0,0],icons=['🏇','🐎','🐎','🐎'];svg.innerHTML=`<rect width="340" height="245" fill="#b5d6a4"/>${Array.from({length:4},(_,i)=>`<rect x="12" y="${12+i*56}" width="316" height="51" rx="9" fill="${i%2?'#d9b68b':'#cba57c'}"/><path d="M12 ${65+i*56}" H328" stroke="#fff6e6" stroke-width="2" stroke-dasharray="10 10"/>`).join('')}<path d="M305 12 V231" stroke="white" stroke-width="8" stroke-dasharray="10 8"/>${pos.map((v,i)=>`<g transform="translate(${Math.min(280,23+v*1.7)} ${38+i*56})"><text x="0" y="0" font-size="29" text-anchor="middle" dominant-baseline="middle">${icons[i]}</text></g>`).join('')}<text x="240" y="18" font-size="10" fill="#4b362c">ZIEL →</text>`}load();render();
</script></body></html>
