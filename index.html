<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e9da"><title>Mein Traumpferd</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#40302d;background:#fff5e9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:12px 15px;font-weight:750;background:#ffe4ba;color:#553d31;touch-action:manipulation}button:disabled{opacity:.45}button.primary{background:#a8556a;color:white}button.active{background:#a8556a;color:white}.wrap{max-width:980px;margin:auto;padding:12px 12px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(23px,5vw,35px);margin:12px 0}h2{margin:6px 0 14px;font-size:23px}h3{margin:8px 0}.muted{color:#7e6a62;font-size:14px}.pill{background:#fff;border-radius:50px;padding:9px 12px;font-weight:800;white-space:nowrap}.nav{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#fff5e9;padding:9px 0}.nav button{padding:10px 2px;font-size:clamp(10px,2.6vw,14px);border-radius:12px}.card{background:#fff;border:1px solid #f0e2d2;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 4px 14px #50321a0b}.scene{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(#a9dff1 0 57%,#d9e6b7 57% 72%,#81b77d 72%);height:270px}.scene:before{content:'☁️　　　 ☁️';position:absolute;top:25px;left:10%;font-size:29px;opacity:.8}.scene:after{content:'';position:absolute;bottom:0;left:0;right:0;height:23px;background:#a7774e}.horse{position:absolute;left:50%;bottom:20px;width:min(83%,380px);height:215px;transform:translateX(-50%);overflow:visible}.horse.running{animation:bob .36s infinite alternate}.horse.jump{animation:jump .9s ease-in-out}.horse.turn{animation:turn .9s ease-in-out}@keyframes bob{to{transform:translate(-50%,-6px)}}@keyframes jump{45%{transform:translate(-50%,-80px) rotate(-7deg)}}@keyframes turn{50%{transform:translateX(-50%) scaleX(.8) rotate(4deg)}}.leg{transform-box:fill-box;transform-origin:top center}.running .leg.front{animation:legA .34s infinite alternate}.running .leg.back{animation:legB .34s infinite alternate}@keyframes legA{to{transform:rotate(25deg)}}@keyframes legB{to{transform:rotate(-24deg)}}.flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stat{margin:11px 0}.bar{height:13px;background:#f3e5d9;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#e6a46e,#7caf7c);border-radius:99px;transition:width .3s}.sceneLabel{position:absolute;top:12px;right:12px;background:#ffffffd9;padding:8px 12px;border-radius:12px;font-weight:700}.item{border:2px solid #f2e6d8;border-radius:18px;padding:13px;text-align:center}.item .emoji{font-size:33px}.item button{width:100%;margin-top:8px}.hidden{display:none!important}.question{font-size:clamp(35px,9vw,60px);text-align:center;font-weight:900;margin:14px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{font-size:25px;background:#fff1d9;padding:18px}.feedback{text-align:center;min-height:27px;font-weight:700}.track{height:140px;background:linear-gradient(#cde9fd 0 20%,#8bc481 20% 36%,#cba77d 36% 65%,#a6d48d 65%);border-radius:18px;position:relative;overflow:hidden;margin:15px 0}.runner{position:absolute;left:5%;font-size:32px;transition:left .35s;top:30px}.runner.rival{top:79px;font-size:23px;white-space:nowrap}.finish{position:absolute;right:7%;top:0;height:100%;border-left:7px dashed white}.notice{background:#fff3d7;padding:12px;border-radius:14px}.small{font-size:12px}input,select{border:2px solid #e9d7c5;border-radius:12px;padding:12px;max-width:100%;background:white}.danger{background:#fbe1e1;color:#9c2937}footer{text-align:center;color:#8d786e;font-size:12px;padding:15px}@media(max-width:450px){.wrap{padding:8px 9px 80px}.card{padding:13px}.scene{height:240px}.horse{height:185px}.nav{gap:3px}.nav button{padding:9px 1px}}
</style></head><body><div class="wrap"><header><h1>🐴 Mein Traumpferd</h1><span class="pill" id="money">🪙 0</span></header><div class="nav"><button data-page="stall" class="active">🏡 Stall</button><button data-page="shop">🛍️ Laden</button><button data-page="training">📚 Training</button><button data-page="ride">🌳 Ausritt</button><button data-page="race">🏆 Rennen</button><button data-page="profiles">🐴 Pferde</button></div><main id="app"></main><footer>Ohne Werbung · Spielstände auf diesem Gerät · Für iPhone und iPad</footer></div><script>
(()=>{'use strict';const KEY='traumpferd_v3_profiles',ACTIVE='traumpferd_v3_active';const colors={Brauner:'#9b613e',Rappe:'#3b3536',Schimmel:'#dedbd1',Fuchs:'#c97639',Falbe:'#c7a46a'};const manes={Dunkel:'#352723',Hell:'#e8cb8d',Schwarz:'#242224',Rotbraun:'#8e4a30'};const goods=[['brush','🪮','Striegel',30,'tool'],['hoof','🧹','Hufkratzer',35,'tool'],['halter','🩷','Rosa Halfter',55,'halter'],['halterBlue','💙','Blaues Halfter',65,'halter'],['saddle','🏇','Brauner Sattel',100,'saddle'],['saddleBlack','🖤','Schwarzer Sattel',120,'saddle'],['maneHell','✨','Helle Mähne',55,'mane'],['maneBlack','🌑','Schwarze Mähne',55,'mane'],['maneRed','🍁','Rotbraune Mähne',55,'mane'],['coatRappe','🐎','Fell: Rappe',80,'coat'],['coatSchimmel','🤍','Fell: Schimmel',80,'coat'],['coatFuchs','🧡','Fell: Fuchs',80,'coat'],['coatFalbe','🌾','Fell: Falbe',80,'coat']];let profiles=load(),active=localStorage.getItem(ACTIVE),page='stall',mode=null,game=null,locked=false,trainingRow=0,trainingKind='mix';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}function fresh(name){return {name,coins:65,stars:0,coat:'Brauner',mane:'Dunkel',equipped:{halter:null,saddle:null},owned:[],stats:{food:85,clean:75,happy:85,energy:95},seen:Date.now(),history:{},wins:0}}function save(){localStorage.setItem(KEY,JSON.stringify(profiles));localStorage.setItem(ACTIVE,active)}if(!Object.keys(profiles).length){profiles['Pferd 1']=fresh('Sternchen');active='Pferd 1';save()}if(!profiles[active])active=Object.keys(profiles)[0];function p(){return profiles[active]}function decay(){let x=p(),hours=Math.min(72,Math.max(0,(Date.now()-x.seen)/3600000));x.stats.food=Math.max(25,x.stats.food-hours*.65);x.stats.clean=Math.max(20,x.stats.clean-hours*.45);x.stats.happy=Math.max(30,x.stats.happy-hours*.25);x.stats.energy=Math.min(100,x.stats.energy+hours*2);x.seen=Date.now();save()}decay();const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(v)=>Math.max(0,Math.min(100,v));function horseSvg(){let x=p(),coat=colors[x.coat]||colors.Brauner,mane=manes[x.mane]||manes.Dunkel;return `<svg class="horse" viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" aria-label="Ganzkörperpferd ${esc(x.name)}"><g stroke="#5e4539" stroke-width="3" stroke-linejoin="round"><path d="M120 107 Q87 76 70 91 Q99 107 85 157" fill="none" stroke="${mane}" stroke-width="15" stroke-linecap="round"/><g class="leg back" fill="${coat}"><path d="M147 149 L145 206 L135 238 L158 238 L169 206 L181 151Z"/><path d="M194 151 L200 204 L193 238 L218 238 L221 201 L225 149Z"/></g><g class="leg front" fill="${coat}"><path d="M290 146 L296 201 L287 238 L313 238 L318 197 L323 145Z"/><path d="M329 143 L338 199 L335 238 L358 238 L359 195 L356 137Z"/></g><path d="M108 113 Q111 91 149 84 Q203 73 257 85 Q301 93 317 79 Q337 62 348 41 Q356 29 372 35 L389 50 Q405 55 421 70 Q433 82 418 95 Q402 107 378 95 L356 86 Q345 110 330 130 Q312 162 273 165 L164 162 Q122 158 108 113Z" fill="${coat}"/><path d="M342 65 Q346 30 370 23 L377 43" fill="none" stroke="${mane}" stroke-width="17"/><path d="M366 35 L363 9 L378 15 L384 37" fill="${coat}"/><path d="M390 43 L398 18 L409 49" fill="${coat}"/><circle cx="393" cy="66" r="4.7" fill="#181513" stroke="none"/><ellipse cx="414" cy="87" rx="4" ry="3" fill="#49382e" stroke="none"/><path d="M130 239 h29 M193 239 h25 M287 239 h27 M335 239 h25" stroke="#2b2625" stroke-width="9"/></g>${x.equipped.saddle?`<g><path d="M208 90 Q250 75 290 94 L281 124 L216 126Z" fill="${x.equipped.saddle==='saddleBlack'?'#292528':'#76482e'}" stroke="#392a24" stroke-width="4"/><path d="M248 125 L245 160" stroke="#6c503d" stroke-width="6"/></g>`:''}${x.equipped.halter?`<g fill="none" stroke="${x.equipped.halter==='halterBlue'?'#3b85c6':'#d45e8b'}" stroke-width="5"><path d="M371 44 L383 91 L412 95 M375 82 L415 76"/></g>`:''}</svg>`}function scene(label,run=false){return `<div class="scene"><div class="sceneLabel">${esc(label)}</div><div id="horseArt" class="${run?'horse running':'horse'}">${horseSvg().replace('class="horse"','class=""')}</div></div>`}function stats(){return Object.entries({food:'🥕 Sättigung',clean:'🪮 Sauberkeit',happy:'💕 Freude',energy:'⚡ Energie'}).map(([k,n])=>`<div class="stat"><div class="flex" style="justify-content:space-between"><b>${n}</b><span>${Math.round(p().stats[k])}%</span></div><div class="bar"><span style="width:${clamp(p().stats[k])}%"></span></div></div>`).join('')}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#money').textContent='🪙 '+p().coins;const a=$('#app');if(page==='stall')a.innerHTML=`<section class="card"><h2>Hallo, ${esc(p().name)}! 🐴</h2>${scene('Dein Reiterhof')}<p class="muted">Streichle dein Pferd und kümmere dich um sein Wohlbefinden.</p>${stats()}<div class="grid"><button data-action="pet">💕 Streicheln (gratis)</button><button data-action="feed">🥕 Füttern (10 🪙)</button><button data-action="brush">🪮 Striegeln ${p().owned.includes('brush')?'':'🔒'}</button><button data-action="hoof">🧹 Hufe auskratzen ${p().owned.includes('hoof')?'':'🔒'}</button><button data-action="rest">🌙 Ausruhen</button></div><p id="msg" class="feedback"></p></section><section class="card"><h3>💡 So verdienst du Münzen</h3><p>Beim Ausritt und im Pferderennen löst du Mal- und Geteiltaufgaben. Damit kaufst du Zubehör und Pflegewerkzeuge.</p></section>`;if(page==='shop')a.innerHTML=`<section class="card"><h2>🛍️ Pferdeladen</h2><p>Mit Rechenmünzen kannst du dein Pferd verändern. Gekaufte Sachen bleiben dir erhalten.</p><div class="grid">${goods.map(([id,emoji,label,cost,type])=>{let owned=p().owned.includes(id),equipped=(type==='halter'||type==='saddle')&&p().equipped[type]===id;return `<div class="item"><div class="emoji">${emoji}</div><b>${label}</b><div class="muted">${owned?'Gekauft':cost+' 🪙'}</div><button data-buy="${id}">${equipped?'✓ Angelegt':owned?'Anlegen / wählen':'Kaufen'}</button></div>`}).join('')}</div><p id="msg" class="feedback"></p></section>`;if(page==='training')a.innerHTML=`<section class="card"><h2>📚 Reittraining</h2><p>Übe in deinem Tempo und verdiene Münzen für dein Pferd.</p><div class="flex"><label>Reihe <select id="rowSelect"><option value="0">Alle Reihen</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${trainingRow===i+1?'selected':''}>${i+1}er-Reihe</option>`).join('')}</select></label><label>Aufgaben <select id="kindSelect"><option value="mix">Mal und Geteilt</option><option value="mul">Nur Mal</option><option value="div">Nur Geteilt</option></select></label></div><div id="playArea"></div></section>`;if(page==='ride'||page==='race')a.innerHTML=`<section class="card"><h2>${page==='ride'?'🌳 Ausritt':'🏆 Pferderennen'}</h2><div id="topControls"></div>${scene(page==='ride'?'Waldweg':'Rennbahn',!!game)}${page==='race'?`<div class="track"><div class="finish"></div><div class="runner" id="playerRunner">🐎</div><div class="runner rival" id="rivalRunner">🐴 🐎 🐴</div></div>`:''}<div id="playArea"></div></section>`;if(page==='profiles')a.innerHTML=`<section class="card"><h2>🐴 Meine Pferde</h2><p>Jedes Pferd hat eigene Münzen, Ausrüstung und einen eigenen Lernfortschritt.</p><div class="grid">${Object.keys(profiles).map(id=>`<button data-profile="${esc(id)}" class="${id===active?'primary':''}">🐴 ${esc(profiles[id].name)} ${id===active?'✓':''}</button>`).join('')}</div><h3>Neues Pferd</h3><div class="flex"><input id="newName" maxlength="24" placeholder="Name deines Pferdes"><button class="primary" data-action="new">Pferd anlegen</button></div><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><h3>Spielstand zurücksetzen</h3><p class="muted">Nur das gerade ausgewählte Pferd wird zurückgesetzt.</p><button class="danger" data-action="reset">🔄 Mit ${esc(p().name)} neu starten</button><p id="msg"></p></section>`;if(page==='training'||page==='ride'||page==='race')renderGame()}function say(t){let m=$('#msg');if(m)m.textContent=t}function action(a){let x=p();if(a==='pet'){x.stats.happy=clamp(x.stats.happy+9);say('💕 '+x.name+' freut sich!')}if(a==='feed'){if(x.coins<10)return say('Du brauchst 10 Münzen. Reite eine Runde!');x.coins-=10;x.stats.food=clamp(x.stats.food+22);say('🥕 Lecker!')}if(a==='brush'||a==='hoof'){let id=a==='brush'?'brush':'hoof';if(!x.owned.includes(id)){page='shop';render();return}x.stats.clean=clamp(x.stats.clean+(a==='brush'?17:12));x.stats.happy=clamp(x.stats.happy+3);say(a==='brush'?'✨ Schön gestriegelt!':'✨ Die Hufe sind sauber!')}if(a==='rest'){x.stats.energy=clamp(x.stats.energy+20);say('🌙 Eine erholsame Pause!')}if(a==='new'){let n=$('#newName').value.trim();if(!n)return say('Bitte gib einen Namen ein.');let id='p'+Date.now();profiles[id]=fresh(n);active=id;save();render();return}if(a==='reset'){if(!confirm('Wirklich den Spielstand von '+x.name+' löschen und neu beginnen?'))return;profiles[active]=fresh(x.name);game=null;save();render();return}save();$('#money').textContent='🪙 '+x.coins; if(page==='stall'){let msg=$('#msg')?.textContent;render();say(msg)}}function buy(id){let item=goods.find(i=>i[0]===id);if(!item)return;let [_,emoji,label,cost,type]=item,x=p();if(!x.owned.includes(id)){if(x.coins<cost){say('Noch '+(cost-x.coins)+' Münzen fehlen. Viel Spaß beim Reiten!');return}x.coins-=cost;x.owned.push(id)}if(type==='halter'||type==='saddle'){x.equipped[type]=x.equipped[type]===id?null:id}if(type==='mane')x.mane=id==='maneHell'?'Hell':id==='maneBlack'?'Schwarz':'Rotbraun';if(type==='coat')x.coat=id.replace('coat','');save();render()}function question(){let hist=p().history, pool=[];for(let a=1;a<=10;a++)for(let b=1;b<=10;b++){if(mode==='training'&&trainingRow&&a!==trainingRow&&b!==trainingRow)continue;let k=a+'x'+b,h=hist[k]||{ok:0,wrong:0};pool.push({a,b,k,w:Math.max(1,5+h.wrong*3-h.ok)})}let total=pool.reduce((s,v)=>s+v.w,0),r=Math.random()*total,chosen=pool[0];for(let v of pool){r-=v.w;if(r<=0){chosen=v;break}}let div=mode==='training'?(trainingKind==='div'||(trainingKind==='mix'&&Math.random()<.5)):Math.random()<.45;let correct=div?chosen.a:chosen.a*chosen.b;let text=div?`${chosen.a*chosen.b} ÷ ${chosen.b}`:`${chosen.a} × ${chosen.b}`;let opts=new Set([correct]);while(opts.size<4){let z=correct+(Math.floor(Math.random()*9)-4);if(z>0&&z<=100)opts.add(z)}return {text,correct,opts:[...opts].sort(()=>Math.random()-.5),key:chosen.k}}function start(kind){mode=kind;game={count:0,goal:kind==='ride'?8:kind==='training'?10:12,correct:0,progress:0,rival:0,q:null,started:0,done:false};next();render()}function next(){game.q=question();game.started=Date.now();locked=false}function renderGame(){let el=$('#playArea');if(!el)return;let tc=$('#topControls');if(tc)tc.innerHTML=!game?`<button class="primary" data-action="start" style="width:100%;font-size:20px;margin-bottom:12px">${page==='race'?'🏁 Rennen starten':'🏇 Ausritt starten'}</button>`:game.done?'':`<div class="notice">🏇 ${game.count} / ${game.goal} Aufgaben · ${game.correct} richtig</div>`;if(!game){el.innerHTML=`<p>${page==='ride'?'Reite durch den Wald! Richtige Antworten lassen dein Pferd traben, springen und Kurven reiten.':page==='training'?'Zehn Aufgaben ohne Zeitdruck. Für jede richtige Antwort gibt es drei Münzen.':'Tritt gegen drei Pferde an! Schnelle, richtige Antworten geben dir einen größeren Geschwindigkeitsschub.'}</p><div class="flex"><button class="primary" data-action="start">${page==='ride'?'🏇 Ausritt starten':page==='training'?'📚 Training starten':'🏁 Rennen starten'}</button><label class="muted">Aufgaben: Mal und Geteilt bis 100</label></div>`;return}if(game.done){el.innerHTML=`<h2>🎉 ${mode==='ride'?'Ausritt geschafft!':mode==='training'?'Training geschafft!':game.progress>=game.rival?'Du hast gewonnen! 🏆':'Ziel erreicht! 🐴'}</h2><p>${game.correct} von ${game.goal} Aufgaben richtig · ${game.reward} Münzen verdient</p><button class="primary" data-action="again">Noch eine Runde</button>`;return}let q=game.q;el.innerHTML=`<p><b>${mode==='ride'?(game.count%3===2?'🌿 Kurve voraus!':game.count%3===1?'🪵 Hindernis voraus!':'🐎 Weiterreiten!'):'🏁 Gib Gas!'}</b> · Aufgabe ${game.count+1} von ${game.goal}</p><div class="question">${q.text} = ?</div><div class="answers">${q.opts.map(n=>`<button data-answer="${n}">${n}</button>`).join('')}</div><p class="feedback" id="feedback">Du schaffst das! 💕</p>`;track()}function track(){if(mode!=='race'||!game)return;let pl=$('#playerRunner'),ri=$('#rivalRunner');if(pl)pl.style.left=Math.min(88,5+game.progress*6.7)+'%';if(ri)ri.style.left=Math.min(88,5+game.rival*6.7)+'%'}function answer(n){if(!game||game.done||locked)return;locked=true;let q=game.q,good=n===q.correct,sec=(Date.now()-game.started)/1000,x=p(),h=x.history[q.key]||{ok:0,wrong:0};if(good){h.ok++;game.correct++;game.progress+=mode==='race'?(sec<3?1.3:sec<6?1:.7):1;x.coins+=3;x.stars++;}else{h.wrong++;if(mode==='race')game.progress+=.12}x.history[q.key]=h;game.count++;if(mode==='race')game.rival+=.8+Math.random()*.25;x.stats.energy=clamp(x.stats.energy-1.8);x.stats.food=clamp(x.stats.food-.8);x.stats.clean=clamp(x.stats.clean-1.1);save();$('#money').textContent='🪙 '+x.coins;let f=$('#feedback');if(f)f.textContent=good?'✨ Richtig! '+(mode==='race'?'Schneller!':'Dein Pferd bewegt sich!'):'Fast! Richtig ist '+q.correct+'. Weiter geht’s!';let art=$('#horseArt');if(art){art.classList.remove('jump','turn');void art.offsetWidth;art.classList.add(good&&mode==='ride'?(game.count%3===2?'jump':'turn'):'running')}track();setTimeout(()=>{if(game.count>=game.goal){game.done=true;game.reward=game.correct*3+(mode==='race'?(game.progress>=game.rival?40:12):15);x.coins+=game.reward-game.correct*3;x.wins+=mode==='race'&&game.progress>=game.rival?1:0;save();render()}else{next();renderGame()}},good?900:1400)}document.addEventListener('change',e=>{if(e.target.id==='rowSelect')trainingRow=Number(e.target.value);if(e.target.id==='kindSelect')trainingKind=e.target.value});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;game=null;render()}else if(b.dataset.action){let a=b.dataset.action;if(a==='start'||a==='again'){if(page==='training'){trainingRow=Number($('#rowSelect')?.value||trainingRow);trainingKind=$('#kindSelect')?.value||trainingKind}start(page)}else action(a)}else if(b.dataset.buy)buy(b.dataset.buy);else if(b.dataset.profile){active=b.dataset.profile;game=null;save();render()}else if(b.dataset.answer)answer(Number(b.dataset.answer))});render();window.addEventListener('pageshow',()=>{if(!game){decay();render()}})})();
</script></body></html>
