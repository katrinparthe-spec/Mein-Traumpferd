<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mein Traumpferd 🐴</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#d9eaf8"><style>
:root{font-family:system-ui,'Trebuchet MS',sans-serif;color:#493c52}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#c5eeff,#f7e9ff);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:17px;padding:12px 16px;background:#fff;color:#493c52;font-weight:800;box-shadow:0 4px 0 #0002}button:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}button:disabled{opacity:.45;cursor:default}.wrap{max-width:1020px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.brand{font-size:clamp(23px,5vw,36px);font-weight:1000;color:#7a468d;text-shadow:2px 2px white}.badge{background:white;border-radius:30px;padding:10px 15px;font-weight:900}.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.nav button{white-space:nowrap}.nav .on{background:#a75ac5;color:white}.panel{background:#fffdf9e8;border:3px solid white;border-radius:27px;padding:20px;box-shadow:0 9px 25px #855d9a30;margin-bottom:15px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}h1,h2,h3{margin:4px 0 12px;color:#8151a3}p{line-height:1.45}.scene{position:relative;border-radius:24px;overflow:hidden;min-height:320px;background:linear-gradient(#9edfff 0 57%,#96d86e 57% 100%);display:grid;place-items:center}.scene:before{content:'☁️　☁️';position:absolute;top:16px;left:15px;font-size:35px}.scene:after{content:'🌷 🌼 🌸 🌻 🌷 🌼';position:absolute;bottom:12px;left:5px;font-size:25px}.horse{font-size:clamp(120px,25vw,200px);filter:drop-shadow(3px 10px 2px #0002);transition:transform .3s;z-index:1;user-select:none}.horse.bounce{animation:bounce .65s}@keyframes bounce{50%{transform:translateY(-25px) rotate(-5deg)}}.horseName{position:absolute;bottom:48px;background:#fff9;padding:5px 18px;border-radius:30px;font-weight:900;z-index:2}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.action{background:#f4c8ff}.green{background:#c7f3b4}.pink{background:#ffd1e5}.yellow{background:#ffe49c}.stat{margin:13px 0}.bar{height:17px;border-radius:20px;background:#e9e4eb;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#b5e99d,#6ec7a0);transition:width .3s}.mini{font-size:13px;color:#7d7081}.hidden{display:none!important}.task{text-align:center;background:linear-gradient(140deg,#fff1bb,#ffe1f1);border-radius:24px;padding:20px;margin:15px 0}.equation{font-size:clamp(38px,9vw,65px);font-weight:1000;color:#78489c}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:420px;margin:20px auto}.answers button{font-size:29px;background:white;padding:20px}.notice{min-height:30px;font-weight:800;text-align:center;color:#8553a1}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.item{background:#f8f0ff;border-radius:18px;padding:15px;text-align:center}.item .icon{font-size:44px}.pill{display:inline-block;background:#f2e3fa;padding:7px 12px;border-radius:30px;margin:4px;font-weight:700}.progress{background:#e9d7f3;height:15px;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#b46dd0}.tip{background:#f5e9ff;padding:12px;border-radius:15px}.footer{font-size:12px;text-align:center;color:#73687b;padding:12px}.spark{position:fixed;pointer-events:none;z-index:10;font-size:34px;animation:float 1s forwards}@keyframes float{to{transform:translateY(-110px);opacity:0}}input,select{padding:12px;border:2px solid #d8b8e5;border-radius:13px;max-width:100%}

/* iPhone / iPad: große Touchflächen und sichere Ränder */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}body{overflow-x:hidden}button{min-height:48px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}input,select{font-size:16px;min-height:48px;max-width:100%}.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(20px,env(safe-area-inset-bottom))}.nav{position:sticky;top:0;z-index:20;background:#e7eafaee;backdrop-filter:blur(12px);-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}.nav button{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start}.answers button{min-height:68px;font-size:clamp(23px,6vw,34px)}.equation{font-size:clamp(36px,10vw,70px)}.panel{min-width:0}.row{flex-wrap:wrap}#app{min-height:55vh}@media(max-width:650px){.wrap{padding-top:10px}.top{align-items:flex-start}.brand{font-size:25px}.badge{padding:7px 10px}.grid{display:grid;grid-template-columns:minmax(0,1fr)}.panel{padding:16px;margin-bottom:12px}.items{grid-template-columns:repeat(2,minmax(0,1fr))}.item{min-width:0}.task{padding:12px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answers button{width:100%}.scene{max-width:100%}.footer{padding-bottom:14px}}@media(min-width:651px) and (max-width:1050px){.wrap{max-width:900px}.panel{padding:22px}.answers button{min-width:110px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">🐴 Mein Traumpferd</div><div class="row"><span class="badge" id="coins">🪙 0</span><span class="badge" id="stars">⭐ 0</span></div></header><nav class="nav" id="nav"></nav><main id="app"></main><div class="footer">🌈 Dein Reiterhof · Alles bleibt auf diesem Gerät gespeichert · Keine Werbung</div></div><script>
const KEY='traumpferd-v1';const PROFILES='traumpferd-profiles-v2';const ACTIVE='traumpferd-active-v2';const fresh=(name='Sternchen')=>({name,horse:'🐴',coins:0,stars:0,care:{food:55,clean:55,happy:65},owned:[],equips:[],records:{},sessions:0});let profiles={};let active='';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}s=s||fresh();try{profiles=JSON.parse(localStorage.getItem(PROFILES))||{};active=localStorage.getItem(ACTIVE)||''}catch(e){}if(!Object.keys(profiles).length){active=s.name;profiles[active]=s}else if(profiles[active]){s=profiles[active]}else{active=Object.keys(profiles)[0];s=profiles[active]};s.records ||= {};s.care ||= {food:55,clean:55,happy:65};s.owned ||= [];s.equips ||= [];let tab='hof',game=null,feedback='',nextTimer=null;const $=id=>document.getElementById(id),save=()=>{try{profiles[active]=s;localStorage.setItem(PROFILES,JSON.stringify(profiles));localStorage.setItem(ACTIVE,active);localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},rnd=n=>Math.floor(Math.random()*n),shuffle=a=>a.sort(()=>Math.random()-.5),clamp=n=>Math.max(0,Math.min(100,n));function updateTop(){$('coins').textContent='🪙 '+s.coins;$('stars').textContent='⭐ '+s.stars}function nav(){let labels=[['hof','🏡 Reiterhof'],['lernen','📚 Mathe-Missionen'],['reiten','🏇 Ausreiten'],['laden','🎀 Pferdeladen'],['fortschritt','🏆 Meine Erfolge'],['profile','🐴 Spielstände']];$('nav').innerHTML=labels.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{clearTimeout(nextTimer);game=null;tab=b.dataset.tab;render()})}function scene(){return `<div class="scene"><div class="horse" id="horse">${s.horse}</div><span class="horseName">${esc(s.name)} ${s.equips.includes('bow')?'🎀':''}${s.equips.includes('saddle')?'🧡':''}</span></div>`}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stat(k,l){return `<div class="stat"><b>${l}: ${s.care[k]}%</b><div class="bar"><div class="fill" style="width:${s.care[k]}%"></div></div></div>`}function render(){updateTop();nav();if(game){drawGame();return}if(tab==='hof')hof();if(tab==='lernen')learn();if(tab==='reiten')ride();if(tab==='laden')shop();if(tab==='fortschritt')progress();if(tab==='profile')profilePage()}function hof(){$('app').innerHTML=`<div class="grid"><div class="panel">${scene()}<p>Dein Pferd heißt <b>${esc(s.name)}</b>. Klicke es an, um es zu streicheln! 💗</p><div class="row"><input id="newname" maxlength="18" placeholder="Pferdename" aria-label="Neuer Pferdename"><button id="rename">✏️ Umbenennen</button></div></div><div class="panel"><h2>💕 Kümmere dich um dein Pferd</h2>${stat('food','🥕 Satt')}${stat('clean','🧽 Sauber')}${stat('happy','💗 Glücklich')}<p class="mini">Für die Pflege brauchst du Münzen. Verdiene sie mit kleinen Mathe-Missionen!</p><div class="row"><button class="green" data-care="food">🥕 Füttern · 5 🪙</button><button class="pink" data-care="clean">🧽 Putzen · 5 🪙</button><button class="yellow" data-care="happy">💗 Spielen · 5 🪙</button></div><hr><h3>Dein nächstes Abenteuer</h3><p>Trainiere das Einmaleins und sammle Münzen für dein Pferd!</p><button class="action" id="go">✨ Mission starten</button><p id="msg" class="notice"></p></div></div>`;$('horse').onclick=()=>{s.care.happy=clamp(s.care.happy+2);save();$('horse').classList.remove('bounce');void $('horse').offsetWidth;$('horse').classList.add('bounce');burst('💗')};$('rename').onclick=()=>{let n=$('newname').value.trim();if(n){if(n!==active&&profiles[n]){alert('Diesen Pferdenamen gibt es schon. Wechsle über Spielstände.');return}delete profiles[active];active=n;s.name=n;save();render()}};document.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>{let k=b.dataset.care;if(s.coins<5){$('msg').textContent='Du brauchst 5 Münzen. Spiele erst eine Mathe-Mission!';return}s.coins-=5;s.care[k]=clamp(s.care[k]+25);save();burst('✨');render()});$('go').onclick=()=>{tab='lernen';render()}}function learn(){$('app').innerHTML=`<div class="panel"><h1>📚 Deine Mathe-Missionen</h1><p>Wähle eine Reihe oder trainiere alles durcheinander. Jede Runde hat <b>8 Aufgaben</b>. Du darfst dir Zeit lassen! 🌷</p><div class="items">${Array.from({length:10},(_,i)=>`<button class="item" data-row="${i+1}"><div class="icon">${['🌻','🍎','🌸','🍀','🦋','🌈','⭐','🍓','🌼','💎'][i]}</div>${i+1}er-Reihe</button>`).join('')}</div><br><div class="row"><button class="action" data-mode="mixed">🎲 Alles gemischt</button><button class="green" data-mode="divide">➗ Geteilt-Mission</button><button class="yellow" data-mode="weak">🎯 Meine Knackaufgaben</button></div></div>`;document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>start('row',+b.dataset.row));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode))}function ride(){$('app').innerHTML=`<div class="grid"><div class="panel">${scene()}</div><div class="panel"><h1>🏇 Ausreiten</h1><p>Reite durch die Blumenwiese! Acht Aufgaben führen dich zum Ziel. Für jede richtige Antwort springt dein Pferd über ein Hindernis. 🌿</p><p class="tip">Keine Sorge: Bei einem Fehler bekommst du einen Tipp und kannst weiterüben.</p><button class="action" id="ride">🌈 Ausritt beginnen</button></div></div>`;$('ride').onclick=()=>start('ride')}const all=()=>Array.from({length:100},(_,i)=>[Math.floor(i/10)+1,i%10+1]);function key(a,b,d){return `${a}x${b}${d?'d':'m'}`}function getRecord(k){return s.records[k]||{right:0,wrong:0,last:0,streak:0}}function choose(mode,row){let pairs=all(),div=mode==='divide'||(mode!=='row'&&Math.random()<.48);if(mode==='row')pairs=pairs.filter(p=>p.includes(row));if(mode==='weak'){pairs.sort((p,q)=>score(p,div)-score(q,div));pairs=pairs.slice(0,35)}let now=Date.now();let weighted=pairs.map(p=>{let r=getRecord(key(...p,div)),age=(now-r.last)/86400000;return {p,w:Math.max(1,8-r.streak*1.6+(r.wrong*1.2)+(age>2?2:0))}});let sum=weighted.reduce((v,x)=>v+x.w,0),pick=Math.random()*sum;for(let x of weighted){pick-=x.w;if(pick<=0)return {a:x.p[0],b:x.p[1],div}}return {a:7,b:8,div}}function score(p,d){let r=getRecord(key(...p,d));return r.streak*3-r.wrong*2}function start(mode,row){game={mode,row,i:0,correct:0,earned:0,question:null,locked:false,missed:false,history:[]};newQuestion()}function newQuestion(){if(game.i>=8){finish();return}let q;for(let t=0;t<20;t++){q=choose(game.mode,game.row);if(!game.history.includes(key(q.a,q.b,q.div)))break}game.question=q;game.history.push(key(q.a,q.b,q.div));game.locked=false;game.missed=false;feedback='';drawGame()}function drawGame(){let g=game,q=g.question,answer=q.div?q.b:q.a*q.b,left=q.div?q.a*q.b:q.a,right=q.div?q.a:q.b,operator=q.div?'÷':'×';let opts=new Set([answer]);while(opts.size<4){let candidate=answer+(rnd(11)-5);if(candidate>=1&&candidate<=100)opts.add(candidate);if(opts.size<4&&Math.random()<.3)opts.add(rnd(100)+1)}let choices=shuffle([...opts]);$('app').innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>${g.mode==='ride'?'🏇 Dein Ausritt':'✨ Deine Mathe-Mission'}</h2><button id="stop">↩ Zurück</button></div><div class="progress"><div style="width:${g.i/8*100}%"></div></div><p class="mini">Aufgabe ${g.i+1} von 8 · ${g.correct} richtig</p>${g.mode==='ride'?`<div style="text-align:center;font-size:45px">${'🌳'.repeat(Math.max(1,8-g.i))} 🐎</div>`:''}<div class="task"><div class="equation">${left} ${operator} ${right} = ?</div><p>Tippe auf die richtige Zahl.</p><div class="answers">${choices.map(v=>`<button data-answer="${v}">${v}</button>`).join('')}</div><div class="notice" id="feedback">${feedback}</div><button id="hint">💡 Einen Tipp bekommen</button></div></div>`;$('stop').onclick=()=>{game=null;render()};$('hint').onclick=()=>{$('feedback').textContent=q.div?`Denk an die Malaufgabe: ${q.a} × ? = ${q.a*q.b}`:`Zähle ${q.a}er-Schritte: ${Array.from({length:q.b},(_,i)=>q.a*(i+1)).slice(0,Math.min(5,q.b)).join(', ')}${q.b>5?', …':''}`};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerClick(+b.dataset.answer,answer))}function answerClick(v,correct){let g=game;if(!g||g.locked)return;let q=g.question,k=key(q.a,q.b,q.div),r=getRecord(k);if(v!==correct){g.missed=true;r.wrong++;r.streak=0;s.records[k]=r;save();$('feedback').textContent='Fast! 💕 Versuch es noch einmal. Du schaffst das!';burst('💜');return}g.locked=true;r.right++;r.streak=g.missed?0:r.streak+1;r.last=Date.now();s.records[k]=r;if(!g.missed){g.correct++;g.earned+=3}else g.earned+=1;save();$('feedback').textContent=['Super gemacht! ⭐','Klasse! 🌟','Das war toll! 🦄','Richtig! 💖'][rnd(4)];burst('⭐');document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);nextTimer=setTimeout(()=>{if(game){g.i++;newQuestion()}},850)}function finish(){let g=game;s.coins+=g.earned;s.stars+=g.correct;s.sessions++;if(g.mode==='ride')s.care.happy=clamp(s.care.happy+12);save();game=null;updateTop();$('app').innerHTML=`<div class="panel" style="text-align:center"><div style="font-size:90px">${g.mode==='ride'?'🏇':'🏆'}</div><h1>Geschafft! 🎉</h1><h2>${g.correct} von 8 Aufgaben sofort richtig</h2><p>Du hast <b>${g.earned} 🪙 Münzen</b> und <b>${g.correct} ⭐ Sterne</b> verdient!</p><p>Auch die kniffligen Aufgaben üben wir wieder. Mit jedem Mal wirst du sicherer.</p><div class="row" style="justify-content:center"><button class="action" id="again">🔁 Noch eine Runde</button><button class="green" id="home">🐴 Zum Pferd</button></div></div>`;$('again').onclick=()=>start(g.mode,g.row);$('home').onclick=()=>{tab='hof';render()};burst('🎉')}const catalog=[['bow','🎀','Schleife',15],['saddle','🧡','Schicker Sattel',25],['flowers','🌸','Blumenschmuck',20],['brush','🪮','Glitzerbürste',18],['blanket','🧣','Kuscheldecke',30],['carrot','🥕','Karottenkorb',12]];function shop(){$('app').innerHTML=`<div class="panel"><h1>🎀 Pferdeladen</h1><p>Mit deinen Mathe-Münzen kannst du Zubehör für ${esc(s.name)} kaufen. Alles bleibt in deiner Sammlung!</p><div class="items">${catalog.map(([id,icon,name,price])=>`<div class="item"><div class="icon">${icon}</div><b>${name}</b><p>${price} 🪙</p><button data-buy="${id}" ${s.owned.includes(id)||s.coins<price?'disabled':''}>${s.owned.includes(id)?'✓ Gehört dir':'Kaufen'}</button></div>`).join('')}</div><h2>🐎 Pferde-Freunde</h2><p>Du kannst dein Pferd jederzeit verwandeln:</p><div class="row">${['🐴','🐎','🦄'].map(h=>`<button data-horse="${h}">${h} ${s.horse===h?'✓':''}</button>`).join('')}</div><p class="notice" id="shopmsg"></p></div>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let item=catalog.find(x=>x[0]===b.dataset.buy);if(!item||s.owned.includes(item[0])||s.coins<item[3])return;s.coins-=item[3];s.owned.push(item[0]);s.equips.push(item[0]);save();burst('🎁');render()});document.querySelectorAll('[data-horse]').forEach(b=>b.onclick=()=>{s.horse=b.dataset.horse;save();render()})}function progress(){let mastered=0,rows=Array.from({length:10},(_,i)=>{let row=i+1,done=0,total=0;for(let b=1;b<=10;b++)for(let d=0;d<2;d++){let r=getRecord(key(row,b,d));total++;if(r.streak>=3&&Date.now()-r.last<14*86400000)done++}if(done===20)mastered++;return {row,done}});$('app').innerHTML=`<div class="panel"><h1>🏆 Meine Erfolge</h1><p>⭐ ${s.stars} Sterne gesammelt · 🎯 ${s.sessions} Missionen gespielt</p><p class="tip">Jede Mal- und Geteiltaufgabe wird einzeln geübt. Nach drei sicheren Antworten zählt sie als gefestigt. Wiederhole sie später erneut!</p><h2>Deine Reihen</h2>${rows.map(x=>`<div class="stat"><b>${x.row}er-Reihe: ${x.done} von 20 Aufgaben gefestigt</b><div class="bar"><div class="fill" style="width:${x.done*5}%"></div></div></div>`).join('')}<p>🌟 Vollständig gefestigte Reihen: ${mastered} von 10</p><button class="action" id="train">🎯 Weiterüben</button></div>`;$('train').onclick=()=>start('weak')}function profilePage(){let names=Object.keys(profiles);$('app').innerHTML=`<div class="panel"><h1>🐴 Deine Pferde und Spielstände</h1><p>Jedes Pferd hat eigene Münzen, Sterne, Zubehör und Mathe-Erfolge. Die Spielstände bleiben in diesem Browser auf diesem Gerät gespeichert.</p><div class="items">${names.map(n=>`<div class="item"><div class="icon">${profiles[n].horse||'🐴'}</div><b>${esc(n)}</b><p>⭐ ${profiles[n].stars||0} · 🪙 ${profiles[n].coins||0}</p><button data-switch="${esc(n)}" ${n===active?'disabled':''}>${n===active?'✓ Du spielst hier':'▶ Spielen'}</button></div>`).join('')}</div><hr><h2>✨ Neues Pferd beginnen</h2><div class="row"><input id="profileName" maxlength="18" placeholder="Name des neuen Pferdes"><button class="green" id="createProfile">🐣 Neues Spiel</button></div><hr><h2>🔄 Dieses Pferd zurücksetzen</h2><p class="mini">Nur der Spielstand von <b>${esc(active)}</b> wird gelöscht und neu begonnen. Andere Pferde bleiben erhalten.</p><button class="pink" id="resetProfile">🗑️ Spiel neu starten</button><p class="notice" id="profileMsg"></p></div>`;document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{active=b.dataset.switch;s=profiles[active];save();game=null;tab='hof';render()});$('createProfile').onclick=()=>{let n=$('profileName').value.trim();if(!n){$('profileMsg').textContent='Gib deinem Pferd zuerst einen Namen.';return}if(profiles[n]){$('profileMsg').textContent='Diesen Pferdenamen gibt es schon.';return}active=n;s=fresh(n);save();game=null;tab='hof';render()};$('resetProfile').onclick=()=>{if(!confirm(`Möchtest du ${active} wirklich neu starten? Münzen, Sterne, Zubehör und Lernfortschritt dieses Pferdes gehen verloren.`))return;s=fresh(active);save();game=null;tab='hof';render()}}
function burst(emoji){let el=document.createElement('span');el.className='spark';el.textContent=emoji;el.style.left=(25+rnd(50))+'vw';el.style.top=(30+rnd(40))+'vh';document.body.append(el);setTimeout(()=>el.remove(),1000)}render();
</script></body></html>
